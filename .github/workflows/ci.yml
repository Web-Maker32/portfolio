name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: latest
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - name: Configure Lighthouse Chromium
        shell: pwsh
        run: |
          $chromePath = (pnpm exec node -e "const { chromium } = require('@playwright/test'); console.log(chromium.executablePath())").Trim()
          "CHROME_PATH=$chromePath" >> $env:GITHUB_ENV
      - run: pnpm test:e2e
      - run: pnpm lighthouse
